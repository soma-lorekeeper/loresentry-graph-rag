AWSTemplateFormatVersion: '2010-09-09'
Description: Private refresh artifacts and least-privilege EKS Pod Identity
Parameters:
  ClusterName:
    Type: String
    Default: lore-sentry-k8s
  ContentRoleName:
    Type: String
    AllowedPattern: '[A-Za-z0-9+=,.@_-]+'
Resources:
  RefreshBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub loresentry-refresh-prod-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRefreshArtifacts
            Status: Enabled
            Prefix: refresh/
            ExpirationInDays: 3
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  GraphRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringEquals:
                aws:RequestTag/eks-cluster-name: !Ref ClusterName
                aws:RequestTag/kubernetes-namespace: prod
                aws:RequestTag/kubernetes-service-account: graph-rag-api
      Policies:
        - PolicyName: RefreshArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub ${RefreshBucket.Arn}/refresh/*
  GraphIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Ref ClusterName
      Namespace: prod
      ServiceAccount: graph-rag-api
      RoleArn: !GetAtt GraphRole.Arn
  ContentPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: RefreshArtifacts
      Roles: [!Ref ContentRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
            Resource: !Sub ${RefreshBucket.Arn}/refresh/*
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt RefreshBucket.Arn
            Condition:
              StringLike:
                s3:prefix: refresh/*
Outputs:
  Bucket:
    Value: !Ref RefreshBucket
  GraphRoleArn:
    Value: !GetAtt GraphRole.Arn
