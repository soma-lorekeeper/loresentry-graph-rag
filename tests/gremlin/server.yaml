host: 0.0.0.0
port: 8182
evaluationTimeout: 10000
channelizer: org.apache.tinkerpop.gremlin.server.channel.HttpChannelizer
graphs:
  graph: /opt/gremlin-server/graph-test/graph.properties
scriptEngines:
  gremlin-groovy:
    plugins:
      org.apache.tinkerpop.gremlin.server.jsr223.GremlinServerGremlinPlugin: {}
      org.apache.tinkerpop.gremlin.tinkergraph.jsr223.TinkerGraphGremlinPlugin: {}
      org.apache.tinkerpop.gremlin.jsr223.ScriptFileGremlinPlugin:
        files: [scripts/empty-sample.groovy]
  gremlin-lang: {}
serializers:
  - className: org.apache.tinkerpop.gremlin.util.ser.GraphSONUntypedMessageSerializerV3
  - className: org.apache.tinkerpop.gremlin.util.ser.GraphSONMessageSerializerV3
strictTransactionManagement: false
maxContentLength: 1048576
